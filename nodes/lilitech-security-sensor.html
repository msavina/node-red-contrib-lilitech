<script type="text/javascript" src="resources/node-red-contrib-lilitech/lilitech-editor.js"></script>
<script type="text/javascript">
    RED.nodes.registerType('lilitech-security-sensor', {
        category: 'Lilitech',
        color: '#F15A00',
        defaults: {
            name: { value: '' },
            headunit: { value: '', type: 'lilitech-headunit', required: true },
            deviceId: { value: '', required: true },
            deviceName: { value: '' },
            typeId: { value: '' },
            initialState: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-eye',
        paletteLabel: 'security sensor',
        label: function () {
            return this.name || this.deviceName || 'security sensor';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            LilitechEditor.prepareDevicePicker(this, 'security-sensors');
        },
        oneditsave: function () {
            LilitechEditor.saveDevice(this);
        }
    });
</script>

<script type="text/html" data-template-name="lilitech-security-sensor">
    <div class="form-row">
        <label for="node-input-headunit"><i class="fa fa-server"></i> Headunit</label>
        <input type="text" id="node-input-headunit" />
    </div>
    <div class="form-row">
        <label for="node-input-deviceId"><i class="fa fa-eye"></i> Sensor</label>
        <select id="node-input-deviceId" style="width: 60%"></select>
        <button type="button" id="node-input-lilitech-refresh" class="red-ui-button" title="Reload security sensors"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label>Items</label>
        <span id="node-input-lilitech-items">-</span>
    </div>
    <div class="form-row">
        <label for="node-input-initialState">&nbsp;</label>
        <input type="checkbox" id="node-input-initialState" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-initialState" style="width: 70%">Send the current state on deploy/reconnect</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-tips" id="node-input-lilitech-tip"></div>
</script>

<script type="text/html" data-help-name="lilitech-security-sensor">
    <p>
        Emits the state and the alarms of a Lilitech security sensor (contacts, volumetric, barrier, shock, flood, smoke, fire and gas
        detectors, panic buttons, line, key and float switches) and excludes it, tests it or puts it in maintenance like the app.
    </p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>
            The item to write: <code>exclusion</code> (only on sensors with <i>excludible</i> enabled in the app), <code>testing</code> or
            <code>maintenance</code>.
        </dd>
        <dt>payload <span class="property-type">boolean | object</span></dt>
        <dd><code>true</code> / <code>false</code>, or an object with the items, e.g. <code>{"maintenance": true}</code>.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>One message for each item that changes.</p>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>Item name, e.g. <code>input</code>.</dd>
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Item value.</dd>
        <dt>origin <span class="property-type">string</span></dt>
        <dd>
            Who produced the change: <code>UNIT</code> (headunit/drivers), <code>APP</code> (Lilitech app), <code>NODE-RED</code> (another
            node of this flow) or <code>INITIAL</code> (state sent on deploy).
        </dd>
        <dt>device <span class="property-type">object</span></dt>
        <dd><code>deviceId</code>, <code>name</code>, <code>typeId</code>, <code>roomId</code>.</dd>
    </dl>

    <h3>Items</h3>
    <table>
        <tr>
            <th>Writable</th>
            <th>Read only</th>
        </tr>
        <tr>
            <td>exclusion (sensors with <i>excludible</i>), testing, maintenance</td>
            <td>
                input (<code>true</code> = open / activated), trigger (alarm: <code>true</code> each time the sensor triggers its armed area),
                armed (the area of the sensor is armed); when enabled in the app: tamper, sensorLoss, lowBattery, faultSignal, masked, weak,
                petDetected, maxAlarmsReached
            </td>
        </tr>
    </table>

    <h3>Details</h3>
    <p>
        The exclusion timer is set in the app: the node only excludes and includes the sensor. While excluded, in maintenance or in test
        the sensor does not trigger the alarm.
    </p>
</script>
