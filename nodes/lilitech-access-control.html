<script type="text/javascript" src="resources/node-red-contrib-lilitech/lilitech-editor.js"></script>
<script type="text/javascript">
    RED.nodes.registerType('lilitech-access-control', {
        category: 'Lilitech',
        color: '#F15A00',
        defaults: {
            name: { value: '' },
            headunit: { value: '', type: 'lilitech-headunit', required: true },
            deviceId: { value: '', required: true },
            deviceName: { value: '' },
            typeId: { value: '' },
            initialState: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-key',
        paletteLabel: 'access control',
        label: function () {
            return this.name || this.deviceName || 'access control';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            LilitechEditor.prepareDevicePicker(this, 'access-controls');
        },
        oneditsave: function () {
            LilitechEditor.saveDevice(this);
        }
    });
</script>

<script type="text/html" data-template-name="lilitech-access-control">
    <div class="form-row">
        <label for="node-input-headunit"><i class="fa fa-server"></i> Headunit</label>
        <input type="text" id="node-input-headunit" />
    </div>
    <div class="form-row">
        <label for="node-input-deviceId"><i class="fa fa-key"></i> Reader</label>
        <select id="node-input-deviceId" style="width: 60%"></select>
        <button type="button" id="node-input-lilitech-refresh" class="red-ui-button" title="Reload access controls"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label>Items</label>
        <span id="node-input-lilitech-items">-</span>
    </div>
    <div class="form-row">
        <label for="node-input-initialState">&nbsp;</label>
        <input type="checkbox" id="node-input-initialState" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-initialState" style="width: 70%">Send the current state on deploy/reconnect</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-tips" id="node-input-lilitech-tip"></div>
</script>

<script type="text/html" data-help-name="lilitech-access-control">
    <p>Emits the access attempts on a Lilitech access control (badge reader, keypad or keypad with badge reader), with the user and the reason of a denial.</p>

    <h3>Inputs</h3>
    <p>Only when <i>excludible</i> is enabled on the reader in the app.</p>
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean</span></dt>
        <dd><code>true</code> excludes the reader until it is enabled again, <code>false</code> enables it.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>One message for each access attempt and for each item that changes.</p>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>access</code>, <code>exclusion</code> or <code>tamper</code>.</dd>
        <dt>payload <span class="property-type">string | boolean</span></dt>
        <dd>For <code>access</code>: <code>granted</code> or <code>denied</code>.</dd>
        <dt class="optional">user <span class="property-type">object</span></dt>
        <dd><code>id</code> and <code>name</code> of the user, when recognized.</dd>
        <dt class="optional">reason <span class="property-type">string</span></dt>
        <dd>Why the access was denied, e.g. <code>Pin blocked</code>, <code>User outside the allowed time window</code>, <code>Unidentified user</code>.</dd>
        <dt>origin <span class="property-type">string</span></dt>
        <dd>
            Who produced the change: <code>UNIT</code> (headunit/drivers), <code>APP</code> (Lilitech app), <code>NODE-RED</code> (another
            node of this flow) or <code>INITIAL</code> (state sent on deploy).
        </dd>
        <dt>device <span class="property-type">object</span></dt>
        <dd><code>deviceId</code>, <code>name</code>, <code>typeId</code>, <code>roomId</code>.</dd>
    </dl>

    <h3>Details</h3>
    <p>
        The headunit checks the PIN or the badge and runs the action configured in the app: the node reports the result. A granted access means
        that the action has been sent. The PIN and the badge read by the reader are never emitted.
    </p>
    <p><code>exclusion</code> is emitted when <i>excludible</i> is enabled in the app, <code>tamper</code> when <i>tamperDetection</i> is enabled.</p>
</script>
