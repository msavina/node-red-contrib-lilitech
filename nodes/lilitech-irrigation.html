<script type="text/javascript" src="resources/node-red-contrib-lilitech/lilitech-editor.js"></script>
<script type="text/javascript">
    RED.nodes.registerType('lilitech-irrigation', {
        category: 'Lilitech',
        color: '#F15A00',
        defaults: {
            name: { value: '' },
            headunit: { value: '', type: 'lilitech-headunit', required: true },
            deviceId: { value: '', required: true },
            deviceName: { value: '' },
            typeId: { value: '' },
            outputMode: { value: 'feedback' },
            initialState: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-pagelines',
        paletteLabel: 'irrigation',
        label: function () {
            return this.name || this.deviceName || 'irrigation';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            LilitechEditor.prepareDevicePicker(this, 'irrigations');
        },
        oneditsave: function () {
            LilitechEditor.saveDevice(this);
        }
    });
</script>

<script type="text/html" data-template-name="lilitech-irrigation">
    <div class="form-row">
        <label for="node-input-headunit"><i class="fa fa-server"></i> Headunit</label>
        <input type="text" id="node-input-headunit" />
    </div>
    <div class="form-row">
        <label for="node-input-deviceId"><i class="fa fa-pagelines"></i> Irrigation</label>
        <select id="node-input-deviceId" style="width: 60%"></select>
        <button type="button" id="node-input-lilitech-refresh" class="red-ui-button" title="Reload irrigations"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label>Items</label>
        <span id="node-input-lilitech-items">-</span>
    </div>
    <div class="form-row">
        <label for="node-input-outputMode"><i class="fa fa-sign-out"></i> Output</label>
        <select id="node-input-outputMode" style="width: 70%">
            <option value="feedback">Feedback only (actual state)</option>
            <option value="all">Feedback and commands</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-initialState">&nbsp;</label>
        <input type="checkbox" id="node-input-initialState" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-initialState" style="width: 70%">Send the current state on deploy/reconnect</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-tips" id="node-input-lilitech-tip"></div>
</script>

<script type="text/html" data-help-name="lilitech-irrigation">
    <p>Starts and stops a Lilitech irrigation controller and its programs, and emits its state.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean | string | object</span></dt>
        <dd>
            <ul>
                <li>
                    <code>"play"</code> / <code>"stop"</code> (<code>true</code> / <code>false</code>, <code>"toggle"</code>) starts or stops the
                    controller: when stopped no program runs, not even the scheduled ones.
                </li>
                <li>
                    With <code>msg.program</code>: <code>"play"</code>, <code>"pause"</code>, <code>"stop"</code> or <code>"toggle"</code> commands
                    that program.
                </li>
                <li>An object with the program command, e.g. <code>{"programId": 1, "cmd": "play"}</code> or <code>{"name": "Garden", "cmd": "pause"}</code>.</li>
            </ul>
        </dd>
        <dt class="optional">program <span class="property-type">number | string</span></dt>
        <dd>Id or name of the program to command.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>Item to write: <code>command</code> or <code>programsCmd</code>.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>One message for each item that changes.</p>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>Item name, e.g. <code>status</code>.</dd>
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Item value.</dd>
        <dt class="optional">unit <span class="property-type">string</span></dt>
        <dd>Unit of measure of <code>override</code>: <code>%</code>.</dd>
        <dt>origin <span class="property-type">string</span></dt>
        <dd>
            Who produced the change: <code>UNIT</code> (headunit/drivers), <code>APP</code> (Lilitech app), <code>NODE-RED</code> (another
            node of this flow) or <code>INITIAL</code> (state sent on deploy).
        </dd>
        <dt>device <span class="property-type">object</span></dt>
        <dd><code>deviceId</code>, <code>name</code>, <code>typeId</code>, <code>roomId</code>.</dd>
    </dl>

    <h3>Items</h3>
    <table>
        <tr>
            <th>Writable</th>
            <th>Read only</th>
        </tr>
        <tr>
            <td>command (<code>play</code>, <code>stop</code>), programsCmd</td>
            <td>status, programRunning, programStartAt, programsRun, windy, rainy, override (%)</td>
        </tr>
    </table>
    <ul>
        <li><code>status</code>: <code>play</code> or <code>stop</code>.</li>
        <li><code>programRunning</code>: <code>true</code> while a program is watering.</li>
        <li><code>programStartAt</code>: next scheduled start (ISO date), or <code>null</code>.</li>
        <li>
            <code>programsRun</code>: object with <code>windy</code>, <code>rainy</code>, <code>override</code> and <code>programs</code>, each
            with <code>programId</code>, <code>name</code>, <code>status</code> (<code>play</code>, <code>pause</code>, <code>stop</code>),
            <code>lastRun</code>, <code>totalDuration</code> (ms), <code>startTime</code> and <code>zones</code>. Emitted only when it changes.
        </li>
        <li>
            <code>windy</code>, <code>rainy</code> and <code>override</code> (seasonal adjustment, 10-200%) come from the sensors linked to the
            irrigation in the app.
        </li>
    </ul>

    <h3>Details</h3>
    <p>
        With <i>Feedback only</i> the node emits the state confirmed by the controller (<code>status</code>, <code>programsRun</code>). With
        <i>Feedback and commands</i> it also emits <code>command</code> and <code>programsCmd</code> sent by the app or by other nodes.
    </p>
    <p>A program can be commanded only while the controller is started. The programs are configured in the app.</p>
</script>
