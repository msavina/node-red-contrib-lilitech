<script type="text/javascript" src="resources/node-red-contrib-lilitech/lilitech-editor.js"></script>
<script type="text/javascript">
    RED.nodes.registerType('lilitech-system', {
        category: 'Lilitech',
        color: '#F15A00',
        defaults: {
            name: { value: '' },
            headunit: { value: '', type: 'lilitech-headunit', required: true },
            deviceId: { value: '', required: true },
            deviceName: { value: '' },
            typeId: { value: '' },
            currentTime: { value: false },
            forecast: { value: false },
            initialState: { value: true }
        },
        inputs: 0,
        outputs: 1,
        icon: 'font-awesome/fa-sun-o',
        paletteLabel: 'system',
        label: function () {
            return this.name || this.deviceName || 'system';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            LilitechEditor.prepareDevicePicker(this, 'systems');
        },
        oneditsave: function () {
            LilitechEditor.saveDevice(this);
        }
    });
</script>

<script type="text/html" data-template-name="lilitech-system">
    <div class="form-row">
        <label for="node-input-headunit"><i class="fa fa-server"></i> Headunit</label>
        <input type="text" id="node-input-headunit" />
    </div>
    <div class="form-row">
        <label for="node-input-deviceId"><i class="fa fa-sun-o"></i> System</label>
        <select id="node-input-deviceId" style="width: 60%"></select>
        <button type="button" id="node-input-lilitech-refresh" class="red-ui-button" title="Reload systems"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label>Items</label>
        <span id="node-input-lilitech-items">-</span>
    </div>
    <div class="form-row">
        <label for="node-input-currentTime">&nbsp;</label>
        <input type="checkbox" id="node-input-currentTime" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-currentTime" style="width: 70%">Send the current day and time every minute (clock)</label>
    </div>
    <div class="form-row">
        <label for="node-input-forecast">&nbsp;</label>
        <input type="checkbox" id="node-input-forecast" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-forecast" style="width: 70%">Send the daily and hourly forecast (weather)</label>
    </div>
    <div class="form-row">
        <label for="node-input-initialState">&nbsp;</label>
        <input type="checkbox" id="node-input-initialState" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-initialState" style="width: 70%">Send the current state on deploy/reconnect</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-tips" id="node-input-lilitech-tip"></div>
</script>

<script type="text/html" data-help-name="lilitech-system">
    <p>Emits the values of a Lilitech system device: the clock (sunrise, sunset, night) or the weather. The node has no input: systems are read only.</p>

    <h3>Outputs</h3>
    <p>One message for each item that changes.</p>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>Item name, e.g. <code>sunset</code> or <code>temperatureValue</code>.</dd>
        <dt>payload <span class="property-type">boolean | number | string | object</span></dt>
        <dd>Item value.</dd>
        <dt class="optional">unit <span class="property-type">string</span></dt>
        <dd>Unit of measure, e.g. <code>°C</code>, when the item has one.</dd>
        <dt>origin <span class="property-type">string</span></dt>
        <dd><code>UNIT</code> (headunit/drivers), <code>APP</code> or <code>INITIAL</code> (state sent on deploy).</dd>
        <dt>device <span class="property-type">object</span></dt>
        <dd><code>deviceId</code>, <code>name</code>, <code>typeId</code>, <code>roomId</code>.</dd>
    </dl>

    <h3>Clock</h3>
    <ul>
        <li><code>sunrise</code> / <code>sunset</code>: <code>true</code> at sunrise / sunset, <code>false</code> a minute later.</li>
        <li><code>night</code>: <code>true</code> from sunset to sunrise.</li>
        <li><code>sunriseTime</code> / <code>sunsetTime</code>: today's times, e.g. <code>"07:05"</code>.</li>
    </ul>
    <p>
        With <i>Send the current day and time every minute</i> the node also emits <code>currentDayTime</code>
        (<code>{"day": 0, "time": "09:16"}</code>, <code>day</code> 0 = Monday, as in the app scenarios), <code>currentDay</code>
        (0 = Sunday), <code>currentHour</code> and <code>currentMinute</code>.
    </p>
    <p>The clock uses the time zone and the position of the headunit set in the app.</p>

    <h3>Weather</h3>
    <ul>
        <li><code>weather</code>: <code>clear</code>, <code>clouds</code>, <code>drizzle</code>, <code>fog</code>, <code>rain</code>, <code>thunderstorm</code>, <code>snow</code>, ...</li>
        <li>
            <code>temperatureValue</code>, <code>temperatureMinValue</code>, <code>temperatureMaxValue</code>, <code>temperaturePerceived</code> (°C),
            <code>humidityValue</code> (%), <code>pressureValue</code> (hPa).
        </li>
        <li><code>windSpeed</code>, <code>windGustsValue</code> (km/h), <code>windDirection</code> (°).</li>
        <li><code>rainAmountHour</code> (mm/h), <code>rainStatus</code> (<code>true</code> while it rains).</li>
        <li><code>uvIndex</code>, <code>airPollutionIndex</code> (1 = good ... 5 = very poor).</li>
        <li><code>weatherAlerts</code> and <code>weatherAlertsEvent</code> (array with the alert names, e.g. <code>["Yellow Wind Warning"]</code>).</li>
        <li><code>city</code>, <code>sunriseTime</code>, <code>sunsetTime</code>.</li>
    </ul>
    <p>
        With <i>Send the daily and hourly forecast</i> the node also emits <code>forecastDaily</code> (8 days, each with <code>weather</code>,
        <code>temperatureDay</code>, <code>temperatureMin</code>, <code>temperatureMax</code> and <code>pop</code>, the probability of
        precipitation 0-1) and <code>forecastHourly</code> (24 hours, each with <code>weather</code> and <code>temperature</code>).
    </p>

    <h3>Details</h3>
    <p>
        The headunit sends the clock and the weather every minute: the node emits an item only when its value changes. The weather comes from the
        OpenWeather technology configured in the app.
    </p>
</script>
