<script type="text/javascript">
    (function () {
        const TYPE_ITEMS = {
            onOff: ['switch'],
            dimmer: ['switch', 'brightness'],
            tunableWhite: ['switch', 'brightness', 'temperature'],
            rgb: ['switch', 'color', 'brightnessColor'],
            rgbWhite: ['switch', 'brightness', 'color', 'brightnessColor'],
            rgbTunableWhite: ['switch', 'brightness', 'temperature', 'color', 'brightnessColor']
        };

        /*--------------------------------------------------------------------------------------------------------------
        --------------------------------------------------------------------------------------------------------------*/
        function showItems(typeId, scenesAvailable) {
            const items = (TYPE_ITEMS[typeId] || []).slice();
            if (scenesAvailable) items.push('scene');
            $('#node-input-lilitech-items').text(items.length ? items.join(', ') : '-');
        }

        /*--------------------------------------------------------------------------------------------------------------
            Carica l'elenco delle lights dalla headunit selezionata
        --------------------------------------------------------------------------------------------------------------*/
        function loadDevices(node) {
            const select = $('#node-input-deviceId');
            const headunitId = $('#node-input-headunit').val();
            const headunit = RED.nodes.node(headunitId);
            const current = select.val() || node.deviceId;
            const tip = $('#node-input-lilitech-tip');

            if (!headunit) {
                tip.text('Select or create a headunit first.');
                return;
            }
            tip.text('Loading lights...');
            $.getJSON('lilitech/devices', { familyId: 'lights', config: headunitId, url: headunit.url })
                .done(function (devices) {
                    select.empty();
                    devices
                        .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                        .forEach(function (d) {
                            $('<option/>')
                                .val(d.deviceId)
                                .text(`${d.name || d.deviceId} (${d.typeId})`)
                                .data('device', d)
                                .appendTo(select);
                        });
                    if (current && !devices.some((d) => d.deviceId === current)) {
                        $('<option/>').val(current).text(`${node.deviceName || current} (not found)`).appendTo(select);
                    }
                    select.val(current || (devices[0] && devices[0].deviceId)).trigger('change');
                    tip.text(devices.length ? '' : 'No lights found on this headunit.');
                })
                .fail(function (xhr) {
                    tip.text((xhr.responseJSON && xhr.responseJSON.error) || 'Unable to load the lights.');
                    if (current && !select.find(`option[value="${current}"]`).length) {
                        $('<option/>').val(current).text(node.deviceName || current).appendTo(select);
                        select.val(current);
                    }
                });
        }

        RED.nodes.registerType('lilitech-light', {
            category: 'Lilitech',
            color: '#F15A00',
            defaults: {
                name: { value: '' },
                headunit: { value: '', type: 'lilitech-headunit', required: true },
                deviceId: { value: '', required: true },
                deviceName: { value: '' },
                typeId: { value: '' },
                outputMode: { value: 'feedback' },
                initialState: { value: true }
            },
            inputs: 1,
            outputs: 1,
            icon: 'font-awesome/fa-lightbulb-o',
            paletteLabel: 'light',
            label: function () {
                return this.name || this.deviceName || 'light';
            },
            labelStyle: function () {
                return this.name ? 'node_label_italic' : '';
            },
            oneditprepare: function () {
                const node = this;
                showItems(node.typeId);
                $('#node-input-deviceId').on('change', function () {
                    const d = $(this).find(':selected').data('device');
                    if (d) showItems(d.typeId, d.scenesAvailable);
                });
                $('#node-input-headunit').on('change', function () {
                    loadDevices(node);
                });
                $('#node-input-lilitech-refresh').on('click', function () {
                    loadDevices(node);
                });
            },
            oneditsave: function () {
                const d = $('#node-input-deviceId').find(':selected').data('device');
                if (d) {
                    this.deviceName = d.name;
                    this.typeId = d.typeId;
                }
            }
        });
    })();
</script>

<script type="text/html" data-template-name="lilitech-light">
    <div class="form-row">
        <label for="node-input-headunit"><i class="fa fa-server"></i> Headunit</label>
        <input type="text" id="node-input-headunit" />
    </div>
    <div class="form-row">
        <label for="node-input-deviceId"><i class="fa fa-lightbulb-o"></i> Light</label>
        <select id="node-input-deviceId" style="width: 60%"></select>
        <button type="button" id="node-input-lilitech-refresh" class="red-ui-button" title="Reload lights"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label>Items</label>
        <span id="node-input-lilitech-items">-</span>
    </div>
    <div class="form-row">
        <label for="node-input-outputMode"><i class="fa fa-sign-out"></i> Output</label>
        <select id="node-input-outputMode" style="width: 70%">
            <option value="feedback">Feedback only (actual state)</option>
            <option value="all">Feedback and commands</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-initialState">&nbsp;</label>
        <input type="checkbox" id="node-input-initialState" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-initialState" style="width: 70%">Send the current state on deploy/reconnect</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-tips" id="node-input-lilitech-tip"></div>
</script>

<script type="text/html" data-help-name="lilitech-light">
    <p>Controls a Lilitech light and emits its state changes.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean | string | number | object</span></dt>
        <dd>
            <ul>
                <li><code>true</code> / <code>false</code>, <code>"on"</code> / <code>"off"</code> or <code>"toggle"</code>: switches the light.</li>
                <li>
                    An object with one or more items, e.g. <code>{"switch": true, "brightness": 80}</code> or
                    <code>{"color": {"r": 255, "g": 0, "b": 0}}</code>.
                </li>
                <li>A single value together with <code>msg.topic</code> set to the item name.</li>
            </ul>
        </dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>Item to write when the payload is a single value, e.g. <code>brightness</code>.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>One message for each item that changes.</p>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>Item name, e.g. <code>switchFeedback</code>.</dd>
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Item value. Colors are <code>{r, g, b}</code> objects.</dd>
        <dt>origin <span class="property-type">string</span></dt>
        <dd>
            Who produced the change: <code>UNIT</code> (headunit/drivers), <code>APP</code> (Lilitech app), <code>NODE-RED</code> (another
            node of this flow) or <code>INITIAL</code> (state sent on deploy).
        </dd>
        <dt>device <span class="property-type">object</span></dt>
        <dd><code>deviceId</code>, <code>name</code>, <code>typeId</code>, <code>roomId</code>.</dd>
    </dl>

    <h3>Items</h3>
    <p>The writable items depend on the light type. Each one has a <code>...Feedback</code> item with the actual state.</p>
    <table>
        <tr>
            <th>Type</th>
            <th>Items</th>
        </tr>
        <tr>
            <td>onOff</td>
            <td>switch</td>
        </tr>
        <tr>
            <td>dimmer</td>
            <td>switch, brightness</td>
        </tr>
        <tr>
            <td>tunableWhite</td>
            <td>switch, brightness, temperature</td>
        </tr>
        <tr>
            <td>rgb</td>
            <td>switch, color, brightnessColor</td>
        </tr>
        <tr>
            <td>rgbWhite</td>
            <td>switch, brightness, color, brightnessColor</td>
        </tr>
        <tr>
            <td>rgbTunableWhite</td>
            <td>switch, brightness, temperature, color, brightnessColor</td>
        </tr>
    </table>
    <p>
        <code>brightness</code>, <code>brightnessColor</code> and <code>temperature</code> are percentages (0-100). <code>scene</code> (0-15)
        is available on DALI lights with scenes enabled. <code>powerOffTimerAt</code> and <code>simulated</code> are read only.
    </p>

    <h3>Details</h3>
    <p>
        With <i>Feedback only</i> the node emits the state confirmed by the field device. With <i>Feedback and commands</i> it also emits the
        commands sent by the app or by other nodes, before the device confirms them.
    </p>
</script>
