<script type="text/javascript" src="resources/node-red-contrib-lilitech/lilitech-editor.js"></script>
<script type="text/javascript">
    RED.nodes.registerType('lilitech-actuator', {
        category: 'Lilitech',
        color: '#F15A00',
        defaults: {
            name: { value: '' },
            headunit: { value: '', type: 'lilitech-headunit', required: true },
            deviceId: { value: '', required: true },
            deviceName: { value: '' },
            typeId: { value: '' },
            outputMode: { value: 'feedback' },
            initialState: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-tint',
        paletteLabel: 'actuator',
        label: function () {
            return this.name || this.deviceName || 'actuator';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            LilitechEditor.prepareDevicePicker(this, 'actuators');
        },
        oneditsave: function () {
            LilitechEditor.saveDevice(this);
        }
    });
</script>

<script type="text/html" data-template-name="lilitech-actuator">
    <div class="form-row">
        <label for="node-input-headunit"><i class="fa fa-server"></i> Headunit</label>
        <input type="text" id="node-input-headunit" />
    </div>
    <div class="form-row">
        <label for="node-input-deviceId"><i class="fa fa-tint"></i> Actuator</label>
        <select id="node-input-deviceId" style="width: 60%"></select>
        <button type="button" id="node-input-lilitech-refresh" class="red-ui-button" title="Reload actuators"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label>Items</label>
        <span id="node-input-lilitech-items">-</span>
    </div>
    <div class="form-row">
        <label for="node-input-outputMode"><i class="fa fa-sign-out"></i> Output</label>
        <select id="node-input-outputMode" style="width: 70%">
            <option value="feedback">Feedback only (actual state)</option>
            <option value="all">Feedback and commands</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-initialState">&nbsp;</label>
        <input type="checkbox" id="node-input-initialState" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-initialState" style="width: 70%">Send the current state on deploy/reconnect</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-tips" id="node-input-lilitech-tip"></div>
</script>

<script type="text/html" data-help-name="lilitech-actuator">
    <p>Controls a Lilitech actuator (pump, valve, sprinkler, faucet, servo valve or thermostatic valve) and emits its state changes.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean | string | number | object</span></dt>
        <dd>
            <ul>
                <li>pump, valve, sprinkler, faucet: <code>true</code> / <code>false</code>, <code>"on"</code> / <code>"off"</code> or <code>"toggle"</code>.</li>
                <li>servo valve: <code>"open"</code>, <code>"close"</code> or <code>"stop"</code> (<code>true</code> opens, <code>false</code> closes).</li>
                <li>thermostatic valve: the setpoint in °C, e.g. <code>21.5</code>.</li>
                <li>An object with one or more items, e.g. <code>{"switch": true, "proportionalDrive": 60}</code>.</li>
                <li>A single value together with <code>msg.topic</code> set to the item name.</li>
            </ul>
        </dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>Item to write when the payload is a single value, e.g. <code>proportionalDrive</code>.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>One message for each item that changes.</p>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>Item name, e.g. <code>switchFeedback</code>.</dd>
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Item value.</dd>
        <dt class="optional">unit <span class="property-type">string</span></dt>
        <dd>Unit of measure, e.g. <code>°C</code>, <code>%</code>, <code>l</code>.</dd>
        <dt>origin <span class="property-type">string</span></dt>
        <dd>
            Who produced the change: <code>UNIT</code> (headunit/drivers), <code>APP</code> (Lilitech app), <code>NODE-RED</code> (another
            node of this flow) or <code>INITIAL</code> (state sent on deploy).
        </dd>
        <dt>device <span class="property-type">object</span></dt>
        <dd><code>deviceId</code>, <code>name</code>, <code>typeId</code>, <code>roomId</code>.</dd>
    </dl>

    <h3>Items</h3>
    <p>The writable items depend on the actuator type. Each one has a <code>...Feedback</code> item with the actual state.</p>
    <table>
        <tr>
            <th>Type</th>
            <th>Writable</th>
            <th>Read only</th>
        </tr>
        <tr>
            <td>pump, valve, sprinkler, faucet</td>
            <td>switch, proportionalDrive (0-100 %, proportional actuators only)</td>
            <td>powerOffTimerAt</td>
        </tr>
        <tr>
            <td>servoValve</td>
            <td>drive (<code>open</code>, <code>close</code>, <code>stop</code>)</td>
            <td>
                driveFeedback: <code>open</code>, <code>opening</code>, <code>close</code>, <code>closing</code>, <code>stop</code>,
                <code>idle</code>
            </td>
        </tr>
        <tr>
            <td>thermostaticValve</td>
            <td>setpointTemperature (4-30 °C, steps of 0.5)</td>
            <td>roomTemperature (°C), proportionalDriveFeedback (valve opening, %), battery (%)</td>
        </tr>
    </table>
    <p>
        When enabled on the actuator in the app, every type also emits <code>volumeValue</code> and <code>volumeRelative</code> (liters) with
        <code>volumeRelativeTimestamp</code>, <code>openStatus</code> and <code>faultSignal</code>.
    </p>

    <h3>Details</h3>
    <p>
        With <i>Feedback only</i> the node emits the state confirmed by the field device. With <i>Feedback and commands</i> it also emits the
        commands sent by the app or by other nodes, before the device confirms them.
    </p>
</script>
