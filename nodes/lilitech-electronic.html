<script type="text/javascript" src="resources/node-red-contrib-lilitech/lilitech-editor.js"></script>
<script type="text/javascript">
    RED.nodes.registerType('lilitech-electronic', {
        category: 'Lilitech',
        color: '#F15A00',
        defaults: {
            name: { value: '' },
            headunit: { value: '', type: 'lilitech-headunit', required: true },
            deviceId: { value: '', required: true },
            deviceName: { value: '' },
            typeId: { value: '' },
            initialState: { value: true }
        },
        inputs: 0,
        outputs: 1,
        icon: 'font-awesome/fa-laptop',
        paletteLabel: 'electronic',
        label: function () {
            return this.name || this.deviceName || 'electronic';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            LilitechEditor.prepareDevicePicker(this, 'electronics');
        },
        oneditsave: function () {
            LilitechEditor.saveDevice(this);
        }
    });
</script>

<script type="text/html" data-template-name="lilitech-electronic">
    <div class="form-row">
        <label for="node-input-headunit"><i class="fa fa-server"></i> Headunit</label>
        <input type="text" id="node-input-headunit" />
    </div>
    <div class="form-row">
        <label for="node-input-deviceId"><i class="fa fa-laptop"></i> Device</label>
        <select id="node-input-deviceId" style="width: 60%"></select>
        <button type="button" id="node-input-lilitech-refresh" class="red-ui-button" title="Reload devices"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label>Items</label>
        <span id="node-input-lilitech-items">-</span>
    </div>
    <div class="form-row">
        <label for="node-input-initialState">&nbsp;</label>
        <input type="checkbox" id="node-input-initialState" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-initialState" style="width: 70%">Send the current state on deploy/reconnect</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-tips" id="node-input-lilitech-tip"></div>
</script>

<script type="text/html" data-help-name="lilitech-electronic">
    <p>
        Emits the status of a Lilitech electronic device (smartphone, laptop, tablet, watch, printer, scanner...): whether it is reachable on
        the network. The node has no input: electronic devices are read only.
    </p>

    <h3>Outputs</h3>
    <p>One message every time the status changes.</p>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>isOnline</code>.</dd>
        <dt>payload <span class="property-type">boolean</span></dt>
        <dd><code>true</code> when the device is online, <code>false</code> when it is offline.</dd>
        <dt>origin <span class="property-type">string</span></dt>
        <dd><code>UNIT</code> (headunit/drivers), <code>APP</code> or <code>INITIAL</code> (state sent on deploy).</dd>
        <dt>device <span class="property-type">object</span></dt>
        <dd><code>deviceId</code>, <code>name</code>, <code>typeId</code>, <code>roomId</code>.</dd>
    </dl>
</script>
