<script type="text/javascript" src="resources/node-red-contrib-lilitech/lilitech-editor.js"></script>
<script type="text/javascript">
    RED.nodes.registerType('lilitech-charger', {
        category: 'Lilitech',
        color: '#F15A00',
        defaults: {
            name: { value: '' },
            headunit: { value: '', type: 'lilitech-headunit', required: true },
            deviceId: { value: '', required: true },
            deviceName: { value: '' },
            typeId: { value: '' },
            outputMode: { value: 'feedback' },
            initialState: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-plug',
        paletteLabel: 'charger',
        label: function () {
            return this.name || this.deviceName || 'charger';
        },
        labelStyle: function () {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function () {
            LilitechEditor.prepareDevicePicker(this, 'chargers');
        },
        oneditsave: function () {
            LilitechEditor.saveDevice(this);
        }
    });
</script>

<script type="text/html" data-template-name="lilitech-charger">
    <div class="form-row">
        <label for="node-input-headunit"><i class="fa fa-server"></i> Headunit</label>
        <input type="text" id="node-input-headunit" />
    </div>
    <div class="form-row">
        <label for="node-input-deviceId"><i class="fa fa-plug"></i> Charger</label>
        <select id="node-input-deviceId" style="width: 60%"></select>
        <button type="button" id="node-input-lilitech-refresh" class="red-ui-button" title="Reload chargers"><i class="fa fa-refresh"></i></button>
    </div>
    <div class="form-row">
        <label>Items</label>
        <span id="node-input-lilitech-items">-</span>
    </div>
    <div class="form-row">
        <label for="node-input-outputMode"><i class="fa fa-sign-out"></i> Output</label>
        <select id="node-input-outputMode" style="width: 70%">
            <option value="feedback">Feedback only (actual state)</option>
            <option value="all">Feedback and commands</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-initialState">&nbsp;</label>
        <input type="checkbox" id="node-input-initialState" style="display: inline-block; width: auto; vertical-align: top" />
        <label for="node-input-initialState" style="width: 70%">Send the current state on deploy/reconnect</label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name" />
    </div>
    <div class="form-tips" id="node-input-lilitech-tip"></div>
</script>

<script type="text/html" data-help-name="lilitech-charger">
    <p>Controls a Lilitech EV charger (simple charger or smart charger) and emits its state changes.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">boolean | string | number | object</span></dt>
        <dd>
            <ul>
                <li>charger: <code>true</code> / <code>false</code>, <code>"on"</code> / <code>"off"</code> or <code>"toggle"</code> switches it.</li>
                <li>
                    smart charger: <code>"play"</code> / <code>"pause"</code> (<code>true</code> / <code>false</code>, <code>"toggle"</code>) starts or
                    pauses the charge, <code>"lock"</code> / <code>"unlock"</code> locks the charger.
                </li>
                <li>An object with the item, e.g. <code>{"maxChargingCurrent": 10}</code>.</li>
                <li>A single value together with <code>msg.topic</code> set to the item name.</li>
            </ul>
        </dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>Item to write when the payload is a single value, e.g. <code>maxChargingCurrent</code>.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>One message for each item that changes.</p>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>Item name, e.g. <code>status</code>.</dd>
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Item value.</dd>
        <dt class="optional">unit <span class="property-type">string</span></dt>
        <dd>Unit of measure, e.g. <code>kW</code>.</dd>
        <dt>origin <span class="property-type">string</span></dt>
        <dd>
            Who produced the change: <code>UNIT</code> (headunit/drivers), <code>APP</code> (Lilitech app), <code>NODE-RED</code> (another
            node of this flow) or <code>INITIAL</code> (state sent on deploy).
        </dd>
        <dt>device <span class="property-type">object</span></dt>
        <dd><code>deviceId</code>, <code>name</code>, <code>typeId</code>, <code>roomId</code>.</dd>
    </dl>

    <h3>Items</h3>
    <table>
        <tr>
            <th>Type</th>
            <th>Writable</th>
            <th>Read only</th>
        </tr>
        <tr>
            <td>charger</td>
            <td>switch</td>
            <td>
                switchFeedback; when enabled in the app: power (W), energy and energyRelative (Wh), current (A), voltage (V)
            </td>
        </tr>
        <tr>
            <td>smartCharger</td>
            <td>command (<code>play</code>, <code>pause</code>), commandLock (boolean), maxChargingCurrent (1-16 A)</td>
            <td>status, statusLock, chargingPower (kW), addedEnergy (kWh), chargingTime and sessionTime (s)</td>
        </tr>
    </table>
    <p>
        Both types emit <code>overload</code>, <code>economy</code> and <code>green</code> (energy management) and, when enabled in the app,
        <code>faultSignal</code>.
    </p>
    <p>
        status: <code>disconnected</code>, <code>ready</code>, <code>charging</code>, <code>paused</code>, <code>scheduled</code>,
        <code>locked</code>, <code>lockedCarConnected</code>, <code>waitingForCarDemand</code>, <code>error</code>...
    </p>

    <h3>Details</h3>
    <p>
        With <i>Feedback only</i> the node emits the state confirmed by the charger (<code>switchFeedback</code>, <code>status</code>,
        <code>statusLock</code>). With <i>Feedback and commands</i> it also emits <code>switch</code>, <code>command</code> and
        <code>commandLock</code> sent by the app or by other nodes.
    </p>
    <p>
        A smart charger accepts one item per message. The app disables play/pause while the charger is locked, disconnected or in error; the
        node sends the command anyway and the charger decides.
    </p>
</script>
